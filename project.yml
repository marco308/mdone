name: mDone
options:
  bundleIdPrefix: com.mdone
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  # Localization (issue #163). `en` is the source language the string
  # catalogs are authored in. There is deliberately no `knownRegions` here:
  # XcodeGen derives regions from localized resources and ignores the key,
  # and the catalogs are the real source of truth anyway. A language appears
  # in the built bundle as soon as Localizable.xcstrings has translations for
  # it. See docs/localization.md.
  developmentLanguage: en

settings:
  base:
    # Xcode 26.5 + XcodeGen 2.45.4 no longer inject a default PRODUCT_NAME, so
    # swiftc gets `-module-name ` (empty) and every target fails with
    # "module name "" is not a valid identifier". Pin it to the target name
    # (the historical XcodeGen default) so all schemes build. Build-infra fix,
    # not feature-related — see PR "decisions".
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.6.2"
    CURRENT_PROJECT_VERSION: "44"
    DEVELOPMENT_TEAM: "Z62E7MGREE"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Same XcodeGen 2.45.4 regression: the historical Debug default of
      # ENABLE_TESTABILITY=YES is no longer emitted, so the app module is
      # built without -enable-testing and every `@testable import mDone`
      # test fails to resolve the module. Pin it for Debug. Build-infra fix.
      ENABLE_TESTABILITY: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  mDone:
    type: application
    platform: iOS
    sources:
      - mDone
      - mDoneShared
    dependencies:
      - target: mDoneWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: mDone/Info.plist
        CODE_SIGN_ENTITLEMENTS: mDone/mDone.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # XcodeGen 2.45.4 stopped emitting an iOS SDKROOT for app targets
        # (used to be inferred when `options.xcodeVersion` was current), so
        # the build system was treating this target as macOS-only and no
        # simulator destinations resolved. Pin it explicitly.
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - mDoneTests
        - mDoneUITests
        - mDoneWidgetRenderTests
        - mDoneIntegrationTests
      gatherCoverageData: true

  mDone-macOS:
    type: application
    platform: macOS
    sources:
      - mDone
      - mDoneShared
    settings:
      base:
        INFOPLIST_FILE: mDone/Info.plist
        CODE_SIGN_ENTITLEMENTS: mDone/mDone-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SUPPORTS_MACCATALYST: "NO"
        # PRODUCT_NAME is $(TARGET_NAME), which would make the Swift module
        # `mDone_macOS` and break the `@testable import mDone` in every shared
        # test file. Pin the module name so one test source tree serves both
        # platforms; the bundle is still mDone-macOS.app.
        PRODUCT_MODULE_NAME: mDone
    postBuildScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - mDoneMacTests
        - mDoneMacUITests
      gatherCoverageData: true

  mDoneMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - mDoneMacUITests
    dependencies:
      - target: mDone-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.macuitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: mDone-macOS

  # Same source tree as mDoneTests, compiled against and hosted by the macOS
  # app, so the shared mDone/ + mDoneShared/ code is covered on both platforms.
  # iOS-only cases (Live Activity, focus outbox) already self-exclude behind
  # `#if os(iOS)` in their own files.
  mDoneMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - mDoneTests
    dependencies:
      - target: mDone-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.mactests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mDone-macOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/mDone-macOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  mDoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - mDoneWidgets
      - mDoneShared
    info:
      path: mDoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: mDone Focus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.widgets
        CODE_SIGN_ENTITLEMENTS: mDoneWidgets/mDoneWidgets.entitlements
        # The extension is its own bundle, so it needs its own copy of the
        # catalog and its own extraction pass. See docs/localization.md.
        SWIFT_EMIT_LOC_STRINGS: "YES"

  mDoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - mDoneTests
    dependencies:
      - target: mDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mDone.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/mDone"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Live-server tests: they drive the real services against a running Vikunja
  # instead of MockURLProtocol. They skip themselves when no server answers on
  # MDONE_INTEGRATION_SERVER_URL (default http://localhost:3456), so they are
  # safe to leave in the scheme; PR CI passes -only-testing:mDoneTests, so it
  # compiles them but never runs them. The nightly run lives in
  # .github/workflows/vikunja-integration.yml.
  mDoneIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - mDoneIntegrationTests
    dependencies:
      - target: mDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.integrationtests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mDone.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/mDone"
        BUNDLE_LOADER: "$(TEST_HOST)"

  mDoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - mDoneUITests
    dependencies:
      - target: mDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: mDone

  # Unhosted logic-test target used only to render widget views to PNGs for the
  # marketing site (ImageRenderer). Compiles the widget views + shared models
  # directly (the same set the extension builds from), so it needs NO dependency
  # on the app and can't clash with mDone's copy of the shared types. The
  # generator inside self-disables outside the dev worktree.
  mDoneWidgetRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - mDoneWidgetRenderTests
      - mDoneShared
      - path: mDoneWidgets
        excludes:
          - mDoneWidgets.swift   # @main WidgetBundle — not valid in a test bundle
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdone.app.widgetrender
        GENERATE_INFOPLIST_FILE: "YES"
