name: iOS Tests

# Runs the unit-test bundle (mDoneTests) on every PR, and again on every
# push to main so the Codecov badge in the README tracks main rather than
# the last PR. The .xcodeproj is generated by XcodeGen and not committed,
# so generate it first, same as the CodeQL workflow. UI/snapshot test
# targets are excluded: they need a booted app and are too flaky for CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The simulator intermittently fails to inject the test bundle into the
      # host app: the app launches and idles in its run loop, XCTest never
      # connects, and the run fails without executing a single test. It is an
      # Xcode/CoreSimulator flake rather than anything in the code, so retry it
      # once, and only for that signature. A run that actually executed tests
      # fails the job as it always did.
      #
      # Each attempt writes its own result bundle (xcodebuild refuses to
      # overwrite one), and the coverage step below picks the newest.
      - name: Run unit tests
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild \
              -project mDone.xcodeproj \
              -scheme mDone \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              -only-testing:mDoneTests \
              -resultBundlePath "${1%.log}.xcresult" \
              test 2>&1 | tee "$1"
          }

          if run_tests test-run-1.log; then
            exit 0
          fi

          if grep -qE 'hung before establishing connection|never finished bootstrapping' test-run-1.log; then
            echo "::warning::Test bundle never connected to the host app; retrying once."
            run_tests test-run-2.log
          else
            exit 1
          fi

      # The scheme already gathers coverage (gatherCoverageData in project.yml);
      # this turns the result bundle into the xccov JSON report Codecov reads.
      # codecov.yml drops SwiftUI views and the test targets from the number,
      # so the badge tracks the layers that have coverage targets in CLAUDE.md.
      - name: Export coverage report
        run: |
          bundle=$(ls -dt test-run-*.xcresult | head -n 1)
          xcrun xccov view --report --json "$bundle" > coverage.json
          echo "Exported coverage from $bundle"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.json
          disable_search: true
          flags: ios-unit
          fail_ci_if_error: false
