name: macOS Tests

# Runs the shared unit-test bundle against the macOS app (mDoneMacTests) on
# every PR. Until this existed nothing in CI even compiled the mDone-macOS
# target, so the Views/Mac/ files and every `#if os(macOS)` branch could break
# unnoticed. The .xcodeproj is generated by XcodeGen and not committed, so
# generate it first, same as the iOS and CodeQL workflows.
#
# mDoneMacUITests is excluded: it is the App Store screenshot capture run, and
# it needs a live Vikunja plus credentials, not a regression suite.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Unlike the iOS job, this one runs a real (non-simulator) app bundle, so
      # it has to be signed. Runners have no Apple Development identity, so sign
      # ad-hoc: that still applies the sandbox entitlements the app launches
      # with, without needing the team certificate.
      - name: Run unit tests
        run: |
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone-macOS \
            -destination 'platform=macOS' \
            -only-testing:mDoneMacTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            test
